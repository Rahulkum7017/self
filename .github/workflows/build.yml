name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Caches Gradle dependencies, the build cache and the configuration cache.
      # Without this every run re-resolves dependencies and re-runs codegen,
      # which dominated the ~50 minute build time.
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is "tools platform-tools", but Google removed the
          # legacy "tools" package from the SDK repo — sdkmanager now exits 1 with
          # "Failed to find package 'tools'". Licences are still accepted (that
          # input defaults to true); we just no longer ask for the dead package.
          packages: platform-tools
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules/.pnpm
            node_modules
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            pnpm-${{ hashFiles('pnpm-lock.yaml') }}-
            pnpm-
      - name: Install dependencies
        # Same reason as the pnpm-install composite action: corepack resolves
        # pnpm's binary path before its own download lands and intermittently
        # dies, which would kill a 50 minute build after 30 seconds.
        run: |
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@$PNPM_VERSION"
          pnpm install --no-frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      - name: Publish kmp-sdk to mavenLocal
        run: cd app && node scripts/publish-kmp-local.cjs
      - name: Generate debug keystore
        run: |
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$DEBUG_KEYSTORE" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
      # No separate `react-native bundle` step: the React Native Gradle plugin
      # already bundles JS for the release variant, so bundling here first only
      # duplicated the slowest part of the build.
      - name: Build Release APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/android/app/build/outputs/apk/release/*.apk

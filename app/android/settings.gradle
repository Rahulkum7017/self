pluginManagement {
  includeBuild("../../node_modules/@react-native/gradle-plugin")
  includeBuild(new File(
    ["node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })"]
      .execute(null, rootDir).text.trim()
  ).parentFile.absolutePath + "/android/expo-gradle-plugin")
}
plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex ->
  ex.autolinkLibrariesFromCommand(['pnpm','exec','react-native','config'])
}
rootProject.name = 'Self'

expoAutolinking.exclude = ['@sentry/react-native']
expoAutolinking.useExpoModules()

include ':app'
includeBuild('../../node_modules/@react-native/gradle-plugin')

def passportReaderDir = new File(rootProject.projectDir, './react-native-passport-reader/android')
if (passportReaderDir.exists()) {
  include ':react-native-passport-reader'
  project(':react-native-passport-reader').projectDir = passportReaderDir
}

def nfcReaderDir = new File(rootProject.projectDir, './android-passport-nfc-reader/app')
if (nfcReaderDir.exists()) {
  include ':passportreader'
  project(':passportreader').projectDir = nfcReaderDir
}

def sdkDir = new File(rootProject.projectDir, '../../packages/mobile-sdk-alpha/android')
if (sdkDir.exists()) {
  include ':mobile-sdk-alpha'
  project(':mobile-sdk-alpha').projectDir = sdkDir
}

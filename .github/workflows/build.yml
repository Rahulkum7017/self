name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules/.pnpm
            node_modules
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            pnpm-${{ hashFiles('pnpm-lock.yaml') }}-
            pnpm-
      - name: Install dependencies
        run: corepack enable && pnpm install --no-frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      - name: Publish kmp-sdk to mavenLocal
        run: cd app && node scripts/publish-kmp-local.cjs
      - name: Generate debug keystore
        run: |
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$DEBUG_KEYSTORE" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Bundle JS for Android
        run: cd app && mkdir -p android/app/src/main/assets && npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
      - name: Build Release APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/android/app/build/outputs/apk/release/*.apk

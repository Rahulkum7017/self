name: PNPM Install

description: Install pnpm and run pnpm install.

inputs:
  working_directory:
    description: The directory to install dependencies in.
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Install pnpm
      shell: bash
      # Install pnpm straight from npm rather than letting corepack fetch it on
      # first use. `corepack enable && pnpm --version` races its own download and
      # intermittently dies with
      #   Error: Cannot find module '.../corepack/v1/pnpm/<version>/bin/pnpm.cjs'
      # which failed the whole Workspace CI job before any check could run.
      # Version comes from the packageManager field in package.json.
      run: |
        PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
        echo "Installing pnpm@$PNPM_VERSION"
        npm install --global "pnpm@$PNPM_VERSION"
        pnpm --version

    - name: Install dependencies
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 5
        command: pnpm install --frozen-lockfile
